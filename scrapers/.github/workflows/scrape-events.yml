name: Scrape EMS Events (Minimal Cost)

on:
  schedule:
    # High priority sites every 6 hours
    - cron: '0 */6 * * *'
    # Medium priority sites every 12 hours  
    - cron: '30 */12 * * *'
    # Low priority sites daily
    - cron: '0 2 * * *'
  
  workflow_dispatch:
    inputs:
      priority:
        description: 'Priority level (high/medium/low)'
        required: true
        default: 'high'
        type: choice
        options:
        - high
        - medium
        - low
      site:
        description: 'Specific site to scrape (optional)'
        required: false
        type: string
      dry_run:
        description: 'Dry run (no database writes)'
        required: false
        default: false
        type: boolean

jobs:
  determine-sites:
    runs-on: ubuntu-latest
    outputs:
      sites: ${{ steps.get-sites.outputs.sites }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Determine sites to scrape
        id: get-sites
        run: |
          if [ "${{ github.event.inputs.site }}" != "" ]; then
            echo "sites=[\"${{ github.event.inputs.site }}\"]" >> $GITHUB_OUTPUT
          elif [ "${{ github.event.inputs.priority }}" = "high" ] || [ "$(date +%H)" -eq 0 -o "$(date +%H)" -eq 6 -o "$(date +%H)" -eq 12 -o "$(date +%H)" -eq 18 ]; then
            echo "sites=[\"naemt\",\"redcross\",\"heart-org-basic\"]" >> $GITHUB_OUTPUT
          elif [ "${{ github.event.inputs.priority }}" = "medium" ] || [ "$(date +%H)" -eq 2 -o "$(date +%H)" -eq 14 ]; then
            echo "sites=[\"state-tn\",\"state-fl\",\"state-ca\"]" >> $GITHUB_OUTPUT
          else
            echo "sites=[\"local-provider-1\",\"local-provider-2\"]" >> $GITHUB_OUTPUT
          fi

  scrape:
    needs: determine-sites
    runs-on: ubuntu-latest
    strategy:
      matrix:
        site: ${{ fromJson(needs.determine-sites.outputs.sites) }}
      fail-fast: false
      max-parallel: 3  # Don't overwhelm sites
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'
          
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: Setup Firebase credentials
        env:
          FIREBASE_CREDENTIALS: ${{ secrets.FIREBASE_CREDENTIALS }}
        run: |
          echo "$FIREBASE_CREDENTIALS" > firebase-key.json
          echo "GOOGLE_APPLICATION_CREDENTIALS=firebase-key.json" >> $GITHUB_ENV
          
      - name: Run scraper
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          SITE_NAME: ${{ matrix.site }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: |
          python scripts/scrape_site.py \
            --site "$SITE_NAME" \
            --max-pages 20 \
            --timeout 30 \
            $( [ "$DRY_RUN" = "true" ] && echo "--dry-run" || echo "" )
            
      - name: Cleanup credentials
        if: always()
        run: rm -f firebase-key.json
        
      - name: Upload scraping report
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: scraping-report-${{ matrix.site }}
          path: |
            scraping_report_*.json
            error_log_*.txt
          retention-days: 7

  trigger-processing:
    needs: scrape
    runs-on: ubuntu-latest
    if: always()
    
    steps:
      - name: Trigger Cloud Function
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: |
          # Trigger the processing function
          curl -X POST \
            "https://us-central1-$FIREBASE_PROJECT_ID.cloudfunctions.net/processRawEvents" \
            -H "Content-Type: application/json" \
            -d '{
              "trigger": "github_actions",
              "timestamp": "'$(date -u +%Y-%m-%dT%H:%M:%SZ)'",
              "run_id": "'$GITHUB_RUN_ID'"
            }'

  notify-completion:
    needs: [scrape, trigger-processing]
    runs-on: ubuntu-latest
    if: always()
    
    steps:
      - name: Calculate success rate
        id: stats
        run: |
          # This is a simplified calculation
          # In a real scenario, you'd parse the actual results
          echo "success_rate=85%" >> $GITHUB_OUTPUT
          echo "events_found=42" >> $GITHUB_OUTPUT
          
      - name: Create summary
        run: |
          echo "## Scraping Results 📊" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Success Rate**: ${{ steps.stats.outputs.success_rate }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Events Found**: ${{ steps.stats.outputs.events_found }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Run ID**: ${{ github.run_id }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Trigger**: ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Sites Scraped" >> $GITHUB_STEP_SUMMARY
          echo "${{ toJson(fromJson(needs.determine-sites.outputs.sites)) }}" >> $GITHUB_STEP_SUMMARY